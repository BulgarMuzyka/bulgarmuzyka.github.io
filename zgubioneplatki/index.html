<html lang="PL">

<head>

    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="popup-styles.css">
    <link rel="stylesheet" href="calendar-styles.css">
    <title>X rocznica Zgubionych Płatków</title>
    <script src="scripts.js"></script>

</head>

<body>

    <div id="popup-wrapper">
        <div id="popup-tint" class="full-page-area" onclick="hidePopup()">

        </div>
        <div id="popup-window">
            <div id="popup-content">
                <p id="popup-title">test</p>
            </div>
        </div>
    </div>


    <div id="main-wrapper" class="full-page-area">

        <div class="logo-wrapper">
            <img src="/zgubioneplatki/img/platki_rocznica_logo.png" alt="Platki Logo" class="logo" />
        </div>





        <div class="calendar-wrapper">

            <div class="calendar-row first-row">

                <div id="first-day" class="calendar-day" onclick="dayPopup()">

                </div>
                <div id="second-day" class="calendar-day" onclick="dayPopup()">

                </div>
                <div id="third-day" class="calendar-day" onclick="dayPopup()">

                </div>
                <div id="fourth-day" class="calendar-day" onclick="dayPopup()">

                </div>


            </div>


            <div class="calendar-divider"></div>


            <div class="calendar-row second-row">

                <div id="fifth-day" class="calendar-day" onclick="dayPopup()">
                    <div class="padlock-icon"></div>
                </div>
                <div id="sixth-day" class="calendar-day" onclick="dayPopup()">
                    <div class="padlock-icon"></div>
                </div>
                <div id="seventh-day" class="calendar-day" onclick="dayPopup()">
                    <div class="padlock-icon"></div>
                </div>

            </div>

        </div>

        <h1>Test</h1>

<!--        <h1 style="color:red">mrjgsnjk</h1>-->

    </div>





</body>

</html>
